name: Generate ASCII Artwork

on: push

jobs:
    ASCII_work:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout action
        uses: actions/checkout@v7.0.1

      - name: list files
        run: ls -ltrh

      - name: Instal, Cowsay
        run: sudo apt update && sudo apt install cowsay -y

      - name: Generate ASCII Artwork
        run: cowsay -f dragon "Run for cover, I am dragon ..... RAWR...." >> dragon.txt

      - name: Read file
        run: cat dragon.txt

      - name: upload dragon text file
        uses: actions/upload-artifact@v7
        with:
            name: myartifact
            path: dragon.txt

    Job2:
      runs-on: ubuntu-latest
      needs: ASCII_work
      steps:

      - name: download dragon text file
        uses: actions/download-artifact@v7
        with:
            name: myartifact

      - name: Search Existing File
        run: grep -i "dragon" dragon.txt

      - name: sleep for 10 secs
        run: sleep 2
             
    Job3:
      runs-on: ubuntu-latest
      needs: [ASCII_work,Job2]
      steps:

      - name: download dragon text file
        uses: actions/download-artifact@v7
        with:
            name: myartifact

      - name: sleep 10secs
        run: sleep 2

      - name: Reading File
        run: cat dragon.txt

      - name: deployement
        run: echo "deploying .... ... ..."
        
