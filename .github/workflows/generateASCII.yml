name: Generate ASCII Artwork

on: push

jobs:
    ASCII_work:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout action
        uses: actions/checkout@v7.0.1

      - name: install cowsay
        run: sudo apt update && sudo apt install cowsay -y

      - name: ASCII artwork
        run: cowsay -f dragon "Run for cover, I am dragon ..... RAWR...." >> dragon.txt

      - name: Read file
        run: cat dragon.txt

      - name: list files
        run: ls -ltrh
        
