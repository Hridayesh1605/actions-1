name: Generate ASCII Artwork

on: push

jobs:
    ASCII_work:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout action
        uses: actions/checkout@v7.0.1

      - name: list files
        run: ls -ltrh

      - name: Executing Shell Script
        run: |
          chmod +x ascii_artwork.sh
          ./ascii_artwork.sh
        
